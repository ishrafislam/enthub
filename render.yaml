services:
  - type: web
    name: enthub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Set in the Render dashboard; never committed.
      - key: SPORTSRC_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
